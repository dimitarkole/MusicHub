trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:
- checkout: self
  persistCredentials: true
  fetchDepth: 0

- script: |
    echo "PAT exists? $(GitHubPAT)"
    git config --global user.email "dim_kolev2002@abv.bg"
    git config --global user.name "dimitarkole"

    git remote remove github || true
    git remote add github https://x-access-token:$(GitHubPAT)@github.com/dimitarkole/MusicHub

    git push github HEAD:main
  displayName: "Push to GitHub"