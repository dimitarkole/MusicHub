<div class="row">
  <div class="col-xl-3">
  </div>
  <div class="col-xl-6 ">
    <div class="wrap-login100">
      <form (ngSubmit)="login()" [formGroup]="sendConfingEmailForm" class="">
        <h3>
          Resend config email
        </h3>
        <div class="Wrong-Credentials alert alert-danger" *ngIf="wrongCredentials">{{error}}</div>
        <div class="Wrong-Credentials alert alert-success" *ngIf="successfulCredentials">Successful send config email!</div>

        <div class="wrap-input100 validate-input m-b-16" data-validate="Please enter username">
          <input class="input100" type="text" name="email" placeholder="Email" formControlName="email">
          <div class="form-label text-danger text-right" *ngIf="email.touched && email.hasError('required')">
            The email is required!
          </div>
        </div>
        <div class="container-login100-form-btn">
          <button [disabled]="sendConfingEmailForm.invalid" type="submit" class="login100-form-btn">Send email</button>
        </div>
      </form>
    </div>
  </div>
</div>
