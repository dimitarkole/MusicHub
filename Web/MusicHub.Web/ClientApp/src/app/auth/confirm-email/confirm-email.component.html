<h3 class="text-center">Email verification</h3>

<div class="text-center" *ngIf="!successfulCredentials">

  <p>Enter the code we sent to your email</p>

  <input type="text"
         [(ngModel)]="code"
         class="form-control w-25 mx-auto"
         placeholder="Enter code" />

  <button class="btn btn-primary mt-3" (click)="confirm()">
    Confirm
  </button>

  <div class="text-danger mt-2" *ngIf="wrongCode">
    Wrong verification code
  </div>

</div>

<div *ngIf="successfulCredentials" class="text-center">
  <h4>
    Thanks {{user?.userName}},<br>
    your email is verified.
  </h4>
</div>
