<div id="modal-content-wrapper">
  <header id="modal-header">
    <h3 id="modal-title">Create a new account</h3>
    <hr />
  </header>
  <section id="modal-body">
    <div class="row">
      <div class="col-12">
        You have just received a confirmation email containing
        the activation link for your account.
      </div>
    </div>
  </section>
  <footer id="modal-footer">
    <div class="row">
      <div class="col-md-10">

      </div>
      <div class="col-md-2">
        <button mat-raised-button id="modal-cancel-button" (click)="closeModal()" [mat-dialog-close]="false">Close</button>
      </div>
    </div>
  </footer>
</div>
