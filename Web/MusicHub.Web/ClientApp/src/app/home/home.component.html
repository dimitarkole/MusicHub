<app-musics-list-template [musics]="musicPagination.musics" [type]="''">

</app-musics-list-template>

<div *ngIf ="isSearching && musicPagination.musics.length == 0" class="text-center error-message">
  <app-no-search-results></app-no-search-results>
</div>

<div *ngIf="musicPagination.currentPage == musicPagination.numberOfPages" class="text-center error-message">
  <app-no-more-result></app-no-more-result>
</div>
