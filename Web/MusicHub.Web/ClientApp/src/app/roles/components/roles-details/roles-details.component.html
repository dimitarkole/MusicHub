<div id="modal-content-wrapper modal-dialog">
  <header id="modal-header">
    <h3 id="modal-title">Role details</h3>
    <hr />
  </header>
    <section id="modal-body" class="modal-body">
      <div class="row">
        <div class="col-md-5">
          <div class="row">
            <div class="col-md-6">Name</div>
            <div class="col-md-6">{{role.name}}</div>
          </div>
        </div>
        <div class="col-md-5">
          <div class="row">
            <div class="col-md-6">Count users</div>
            <div class="col-md-6">{{role.usersCount}}</div>
          </div>
        </div>
      </div>
      <div class="form-group ">
        <div class="row">
          <div class="col-md-12">
            <br />
            Permissions
          </div>
        </div>
        <div class="row">
          <div class="col-md-12">
            <table class="table table-striped">
              <thead>
                <tr class="row">
                  <th class="col-md-1">#</th>
                  <th class="col-md-11">Permission</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let permission of role.permissions; index as i" class="row">
                  <td class="col-md-1">{{ i + 1 }}</td>
                  <td class="col-md-11">{{permission.permission.description}}</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </section>

  <footer id="modal-footer">
    <div class="row">
      <div class="col-md-10">
      </div>

      <div class="col-md-2">
        <button mat-raised-button id="modal-cancel-button" (click)="closeModal()" [mat-dialog-close]="false">Close</button>
      </div>
    </div>
  </footer>
</div>
