<div id="modal-content-wrapper modal-dialog">
  <header id="modal-header">
    <h3 id="modal-title">Create a role</h3>
    <hr />
  </header>
  <form (ngSubmit)="OnSubmit()" [formGroup]="roleForm">
    <section id="modal-body" class="modal-body">
      <div class="form-group">
        <label>Name</label>
        <input class="form-control" formControlName="name" type="text" placeholder="Role name">
        <span class="text-danger" *ngIf="name.touched && name.hasError('required')">The name is required!</span>
        <span class="text-danger" *ngIf="name.touched && name.hasError('minlength')">
          Role name must contain {{nameMinLength}} characters!
        </span>
        <span class="text-danger" *ngIf="name.touched && name.hasError('maxlength')">
          Role name must be at most {{nameMinLength}} characters!
        </span>
      </div>
      <div class="form-group">
        <label>Permissions</label>

        <div class="row">
          <select class="form-control col-md-10" id="select-permissions">
            <option *ngFor="let permission of permissions" [value]="permission.id">{{permission.description}}</option>
          </select>

          <button class="col-md-2" (click)="addPermission()" type='button'>
            <span class="glyphicon glyphicon-plus"></span>
          </button>
        </div>
        <div class="row">
          <span class="text-danger" *ngIf="permissionIds.hasError('required')">
            Role permissions are required!
          </span>
          <span class="text-danger" *ngIf="permissionIds.hasError('minlength')">
            Role must contain more than 0 permissions!
          </span>
        </div>
        <div class="row">
          <table class="table table-striped">
            <thead>
              <tr class="row">
                <th class="col-md-1">#</th>
                <th class="col-md-9">Permission</th>
                <th class="col-md-2">Remove</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let permission of selectedPermissions; index as i" class="row">
                <td scope="row" class="col-md-1">{{ i + 1 }}</td>
                <td class="col-md-9">{{permission.description}}</td>
                <td class="col-md-2 table-operation-coll">
                  <button class="btn" (click)="removePermission(permission)" type="button">
                    <span class="glyphicon glyphicon-trash" aria-hidden="true"></span>
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>

    <footer id="modal-footer">
      <div class="row">
        <div class="col-md-8">

        </div>
        <div class="col-md-2">
          <button mat-raised-button id="modal-cancel-button" (click)="closeModal()" [mat-dialog-close]="false">No</button>
        </div>

        <div class="col-md-2">
          <button class="form-btn text-white" mat-raised-button [mat-dialog-close]="true" id="modal-action-button" type="submit" [disabled]="roleForm.invalid">Save</button>
        </div>
      </div>
    </footer>
  </form>
</div>
