<section class="container py-5">
  <div class="row pt-3">
    <!-- Author-->
    <div class="col-lg-3 col-sm-6 mb-30 pb-2"  *ngFor="let user of users; index as i">
      <div class="team-card-style-3 mx-auto">
        <div class="team-thumb">
          <img src="{{user.imageUrl==null? 'https://bootdey.com/img/Content/avatar/avatar7.png': user.imageUrl}}" alt="Author Picture" *ngIf="!user.imageUrl">
        </div>
        <h4 class="team-name">
          <a routerLink="{{'/profile/view/' + user.id}}"> {{user.username?.substring(0, 25)}}</a>
        </h4>
        <div class="team-contact-link">{{user.firstName?.substring(0, 12)+ " " + user.lastName?.substring(0, 12)}}</div>
        <div class="team-contact-link">{{user.email}}</div>
        <div class="team-social-bar-wrap" *ngIf="hasPermition('ManageUserPermissions')">
          <div class="team-social-bar">
            <a routerLink="{{'/users/details/' + user.id}}"> Edit user</a>
          </div>
        </div>
        <app-follow-create class="col-md-5" [userId]="user.id"></app-follow-create>

      </div>
    </div>
  </div>
</section>
