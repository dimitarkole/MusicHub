<div id="modal-content-wrapper">
  <header id="modal-header">
      <h3 id="modal-title">Followers ({{followPagination.followers.length}})</h3>
    <hr />
  </header>
  <section id="modal-body">
    <div class="modal-body">
      <div class="col-md-12">
        <div class="row follow-aria">
          <div class="col-md-12 follow-scroll">
            <div class="row" *ngFor="let follower of followPagination.followers; index as j">
              <img src="https://bootdey.com/img/Content/avatar/avatar2.png" alt="logo" class="col-md-3">
              <a routerLink="{{'/profile/view/' + follower?.follower?.id}}" class="col-md-5" (click)="modal.dismiss('Cross click')">
                {{follower?.follower?.userName?.substring(0, 30)}}<br />
              </a>
              <app-follow-create class="col-md-4" [userId]="follower.follower.id"></app-follow-create>
              <div class="col-md-12">
                <hr />
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
  <footer id="modal-footer">
    <div class="row">
      <div class="col-md-10">

      </div>
      <div class="col-md-2">
        <button mat-raised-button id="modal-cancel-button" (click)="closeModal()" [mat-dialog-close]="false">No</button>
      </div>
    </div>
  </footer>
</div>
