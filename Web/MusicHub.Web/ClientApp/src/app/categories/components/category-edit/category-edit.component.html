<div id="modal-content-wrapper">
  <header id="modal-header">
    <h3 id="modal-title">Edit a category</h3>
    <hr />
  </header>
  <form (ngSubmit)="OnSubmit()" [formGroup]="categoryForm">
    <section id="modal-body">
      <div class="form-group">
        <label>Name</label>
        <input class="form-control" formControlName="name" type="text" placeholder="Category name">
        <span class="text-danger" *ngIf="name.touched && name.hasError('required')">The name is required!</span>
        <span class="text-danger" *ngIf="name.hasError('minlength')">
          Category name must contain {{nameMinLength}} characters!
        </span>
        <span class="text-danger" *ngIf="name.hasError('maxlength')">
          Category name must be at most {{nameMinLength}} characters!
        </span>
      </div>
    </section>
    <footer id="modal-footer">
      <div class="row">
        <div class="col-md-8">

        </div>
        <div class="col-md-2">
          <button mat-raised-button id="modal-cancel-button" (click)="closeModal()" [mat-dialog-close]="false">No</button>
        </div>

        <div class="col-md-2">
          <button class="form-btn text-white" mat-raised-button id="modal-action-button" type="submit" [mat-dialog-close]="true" [disabled]="categoryForm.invalid">Save</button>
        </div>
      </div>
    </footer>
  </form>
</div>
