<h3>{{chart?.name}}</h3>
<br>
<div>
  <ngx-charts-bar-vertical [results]="chart?.series"
                           [view]="view"
                           [roundEdges]="roundEdges"

                           [xAxis]="xAxis"
                           [yAxis]="yAxis">
  </ngx-charts-bar-vertical>
</div>
