<app-playlists-list-template [playlists]="playlistPagination.playlists" [type]="''">

</app-playlists-list-template>

<div *ngIf="isSearching && playlistPagination.playlists.length == 0" class="text-center error-message">
  <app-no-search-results></app-no-search-results>
</div>

<div *ngIf="playlistPagination.currentPage == playlistPagination.numberOfPages" class="text-center error-message">
  <app-no-more-result></app-no-more-result>
</div>
