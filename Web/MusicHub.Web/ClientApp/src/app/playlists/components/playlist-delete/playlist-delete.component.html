<div id="modal-content-wrapper">
  <header id="modal-header">
    <h3 id="modal-title">Delete playlist</h3>
    <hr />
  </header>
  <form (ngSubmit)="OnSubmit()" [formGroup]="categoryForm">
    <section id="modal-body">
      <p>Do you want to delete this playlist?</p>
    </section>
    <footer id="modal-footer">
      <div class="row">
        <div class="col-md-8">

        </div>
        <div class="col-md-2">
          <button mat-raised-button id="modal-cancel-button" (click)="closeModal()" [mat-dialog-close]="false">No</button>
        </div>

        <div class="col-md-2">
          <button mat-raised-button id="modal-cancel-button" (click)="deleteCategory()" [mat-dialog-close]="true">Yes</button>
        </div>
      </div>
    </footer>
  </form>
</div>
