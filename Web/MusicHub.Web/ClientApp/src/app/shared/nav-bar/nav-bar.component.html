<header class="header">
  <div class="container">
    <div class="header_content d-flex flex-row align-items-center justify-content-center row">
      <mat-toolbar-row class="side-bar text-white col-md-1">
        <button type="button" aria-label="Toggle sidenav" mat-icon-button (click)="drawer.toggle()">
          <mat-icon aria-label="Side nav toggle icon">menu</mat-icon>
        </button>
      </mat-toolbar-row>
      <!-- Logo -->
      <div class="logo  col-md-2">
        <a href="#" class="d-flex flex-row align-items-end justify-content-start">
          <img src="../../../../assets/images/icon_2.png" alt="Alternate Text" class="logo_bars" />
          <!--<span class="logo_bars d-flex flex-row align-items-end justify-content-between">
      <span></span><span></span><span></span><span></span><span></span></span> -->
          <span class="logo_text">MusicHub</span>
        </a>
      </div>
      <div class="col-md-1"></div>

      <div class="main_nav  col-md-5">
        <form class="row" (ngSubmit)="updateSearch()" [formGroup]="searchForm">
          <input class="form-control col-md-7 search-elements" formControlName="search" type="text" placeholder="Search">
          <select class="col-md-3 search-elements" formControlName="type">
            <option value="{{option.name}}" *ngFor="let option of searchOptions">{{option.name}}</option>
          </select>
          <button [disabled]="searchForm.invalid" type="submit"
                  class="col-md-2 btnSearch search-elements">
            Search
          </button>
        </form>
      </div>
      <div class="col-md-3"></div>

      <!-- Main Navigation
  <nav class="main_nav">
    <ul class="d-flex flex-row align-items-center justify-content-start">
      <li><a routerLink="/">Musics</a></li>
      <li><a routerLink="/playlists">Playlists</a></li>
    </ul>
  </nav>
    -->
      <!-- User area -->
      <div class="custum_dropdown_menu_header d-flex flex-row align-items-center justify-content-start  col-md-3" *ngIf="isAuth">
        <nav class="main_nav">
          <ul class="d-flex flex-row align-items-start justify-content-start row">
            <!-- Dropdown -->
            <li class="col-sm-3"><a routerLink="/musics/create">Upload</a></li>
            <li class="col-sm-1 text-white">
              <a class="" href="#" id="notification" data-toggle="dropdown">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-bell" viewBox="0 0 16 16">
                  <path d="M8 16a2 2 0 0 0 2-2H6a2 2 0 0 0 2 2zM8 1.918l-.797.161A4.002 4.002 0 0 0 4 6c0 .628-.134 2.197-.459 3.742-.16.767-.376 1.566-.663 2.258h10.244c-.287-.692-.502-1.49-.663-2.258C12.134 8.197 12 6.628 12 6a4.002 4.002 0 0 0-3.203-3.92L8 1.917zM14.22 12c.223.447.481.801.78 1H1c.299-.199.557-.553.78-1C2.68 10.2 3 6.88 3 6c0-2.42 1.72-4.44 4.005-4.901a1 1 0 1 1 1.99 0A5.002 5.002 0 0 1 13 6c0 .88.32 4.2 1.22 6z" />
                </svg>
              </a>
              <div class="dropdown-menu notifications-dropdown-menu">
                <app-notifications-list></app-notifications-list>
              </div>
            </li>
            <li class="col-sm-6">
              <a class="dropdown-toggle" href="#" id="navbardrop" data-toggle="dropdown">
                {{username}}
              </a>

              <!-- admin items -->
              <div class="dropdown-menu">
                <div class="dropdown-item">
                  <a routerLink="/myProfile" class="row text-dark">
                    <small>Wellcom,</small>
                    {{username}}
                  </a>
                </div>

                <!-- user items -->
                <div class="dropdown-item" *ngIf="hasPermition('CategoryAdministrator')">
                  <a routerLink="/categories" class="row text-dark">
                    <i class="col-md-2" style="background: url('../../../../assets/images/icon_addMusic.png') no-repeat;"></i>
                    <div class="col-md-9">
                      Categories
                    </div>
                  </a>
                </div>

                <!-- user items -->
                <div class="dropdown-item" *ngIf="hasPermition('PlaylistCreator')">
                  <a routerLink="/playlists/own" class="row text-dark">
                    <i class="col-md-2" style="background: url('../../../../assets/images/icon_addMusic.png') no-repeat;"></i>
                    <div class="col-md-9">
                      My playlists
                    </div>
                  </a>
                </div>

                <div class="dropdown-item" *ngIf="hasPermition('AlbumCreator')">
                  <a routerLink="/albums/own" class="row text-dark">
                    <i class="col-md-2" style="background: url('../../../../assets/images/icon_addMusic.png') no-repeat;"></i>
                    <div class="col-md-9">
                      My albums
                    </div>
                  </a>
                </div>

                <div class="dropdown-item" *ngIf="hasPermition('MusicCreator')">
                  <a routerLink="/musics/own" class="row text-dark">
                    <i class="col-md-2" style="background: url('../../../../assets/images/icon_addMusic.png') no-repeat;"></i>
                    <div class="col-md-9">
                      My musics
                    </div>
                  </a>
                </div>

                <!-- logout -->
                <div class="dropdown-item">
                  <a (click)="logout()" class="row text-dark">
                    <i class="col-md-2" style="background: url('../../../../assets/images/icon_logout.png') no-repeat;"></i>
                    <div class="col-md-9">
                      Logout
                    </div>
                  </a>
                </div>
              </div>
            </li>
          </ul>
        </nav>
      </div>

      <div class="log_reg d-flex flex-row align-items-center justify-content-start col-md-3" *ngIf="!isAuth">
        <nav class="main_nav">
          <ul class="d-flex flex-row align-items-start justify-content-start row">
            <li><a routerLink="/signin">Sign In</a></li>
            <li><a routerLink="/signup">Sign Up</a></li>
          </ul>
        </nav>
      </div>
    </div>
      </div>
</header>

<mat-sidenav-container class="example-container" style="background:white">
  <mat-sidenav #drawer mode="side" role="navigation" class="side-bar">
    <mat-nav-list>
      <br />
      <br />
      <br />
      <div class="dropdown-item" *ngIf="hasPermition('LicenseCreator')">
        <a mat-list-item routerLink='/license/own' class="row dropdown-item text-dark">
          <img src="../../../../assets/images/icon_ownMusics.png" alt="" class="col-md-3" />
          <div class="col-md-9">
            My licenses
          </div>
        </a>
      </div>

      <div class="dropdown-item" *ngIf="hasPermition('LicenseManager')">
        <a mat-list-item routerLink='/license/all' class="row dropdown-item text-dark">
          <img src="../../../../assets/images/icon_ownMusics.png" alt="" class="col-md-3" />
          <div class="col-md-9">
            All licenses
          </div>
        </a>
      </div>
      <div class="dropdown-item" *ngIf="hasPermition('ManageUserPermissions')">
        <a mat-list-item routerLink='/role/all' class="row dropdown-item text-dark">
          <img src="../../../../assets/images/icon_ownMusics.png" alt="" class="col-md-3" />
          <div class="col-md-9">
            All roles
          </div>
        </a>
      </div>
      <div class="dropdown-item" *ngIf="hasPermition('UserAdministration')">
        <a mat-list-item routerLink='/users/all' class="row dropdown-item text-dark">
          <img src="../../../../assets/images/icon_ownMusics.png" alt="" class="col-md-3" />
          <div class="col-md-9">
            All users
          </div>
        </a>
      </div>
      <div class="dropdown-item" *ngIf="hasPermition('User')">
        <a mat-list-item routerLink='/musics/history' class="row dropdown-item text-dark">
          <img src="../../../../assets/images/icon_ownMusics.png" alt="" class="col-md-3" />
          <div class="col-md-9">
            History
          </div>
        </a>
      </div>
      <div class="dropdown-item" *ngIf="hasPermition('User')">
        <a mat-list-item routerLink='/musics/liked' class="row dropdown-item text-dark">
          <img src="../../../../assets/images/icon_ownMusics.png" alt="" class="col-md-3" />
          <div class="col-md-9">
            Liked music
          </div>
        </a>
      </div>
      <div class="dropdown-item" *ngIf="hasPermition('User')">
        <a mat-list-item routerLink='/playLater' class="row dropdown-item text-dark">
          <img src="../../../../assets/images/icon_ownMusics.png" alt="" class="col-md-3" />
          <div class="col-md-9">
            Play later music
          </div>
        </a>
      </div>
      <app-following-list-nav-bar></app-following-list-nav-bar>

      <!-- <a mat-list-item routerLink='/home/likedMusics' class="row dropdown-item text-dark">
    <img src="../../../../assets/images/icon_ownMusics.png" alt="" class="col-md-3" />
    <div class="col-md-9">
      Liked music
    </div>
  </a>

  <a mat-list-item routerLink='/license/own' class="row dropdown-item text-dark" *ngIf="role==='User'">
    <img src="../../../../assets/images/icon_ownMusics.png" alt="" class="col-md-3" />
    <div class="col-md-9">
      My licenses
    </div>
  </a>
  <a mat-list-item routerLink='/license/all' class="row dropdown-item text-dark" *ngIf="isAdmin">
    <img src="../../../../assets/images/icon_ownMusics.png" alt="" class="col-md-3" />
    <div class="col-md-9">
      All licenses
    </div>
  </a>-->
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <br />
    <br />
    <br />
    <br />

    <div class="container">
      <router-outlet id="content-wrap"></router-outlet>
    </div>

  </mat-sidenav-content>
</mat-sidenav-container>
