<div class="container mt-4">
  <div class="card shadow">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h4 class="mb-0">
        IP Rules
      </h4>

      <button class="btn" (click)="openCreate()">
        <span class="fa fa-plus">Add Rule</span>
      </button>
    </div>

    <div class="card-body p-0">
      <table class="table table-hover table-striped mb-0">
        <thead class="table-light">
          <tr>
            <th>Pattern</th>
            <th>Type</th>
            <th>Description</th>
            <th class="text-center">Enabled</th>
            <!--<th style="width:170px;"></th>-->
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let rule of pagination?.userIpRules">
            <td>
              <code>{{ rule.pattern }}</code>
            </td>

            <td>
              <span class="badge bg-success"
                    *ngIf="rule.ruleType == 1">
                Allow
              </span>

              <span class="badge bg-danger"
                    *ngIf="rule.ruleType == 2">
                Deny
              </span>
            </td>

            <td>
              {{ rule.description }}
            </td>

            <td class="text-center">
              <i class="fa fa-check text-success"
                 *ngIf="rule.isEnabled">
              </i>

              <i class="fa fa-times text-danger"
                 *ngIf="!rule.isEnabled">
              </i>
            </td>

            <!--<td class="text-end">
              <button class="btn btn-sm btn-primary me-2"
                      [routerLink]="['/profile/ip-rules/edit', rule.id]">
                <i class="fa fa-pencil"></i>
              </button>

              <button class="btn btn-sm btn-danger">
                <i class="fa fa-trash"></i>
              </button>
            </td>-->
          </tr>
          <tr *ngIf="model?.userIpRules?.length == 0">
            <td colspan="5" class="text-center p-4">
              No IP rules found.
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
