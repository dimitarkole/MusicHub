<h2 class=" row text-center">
  Play later musics
</h2>
<div class="row">
  <div class="col-md-12">
    <div class="featured_list">
      <div id="jp_container_2" class="jp-audio" role="application" aria-label="media player">
        <div class="jp-type-playlist">
          <div class="jp-playlist">
            <div class="d-flex flex-row align-items-start justify-content-start flex-wrap row" style="">
              <div class="jp-playlist-current col-md-3" *ngFor="let playLaterMusic of playLaterMusicsPagination.playLaterMusics; index as j">

                <img src="{{defauleMusicImagePath}}" alt="logo" class="song_image" /><!-- *ngIf="music.imageUrl==''">-->
                <div class="text-white music-info">
                  <div class="row">
                    <div class="col-md-3">
                      <div class="album_play_button">
                        <a class="album_play_button" routerLink="/musics/play/{{playLaterMusic.music.id}}">
                        </a>
                      </div>
                      </div>
                      <div class="col-md-6">
                        <div class="row">
                          <div class="featured_album col-md-12 text-truncate text-white">
                            {{playLaterMusic.music.name?.substring(0, 25)}}
                          </div>
                          <a routerLink="{{'/profile/view/' + playLaterMusic.music.user?.id}}"
                             class="featured_title text-truncate col-md-12 ">
                            <small>{{playLaterMusic.music.user?.username}}</small>
                          </a>

                        </div>
                      </div>
                      <div class="col-md-2">
                        <div class="dropdown">
                          <button class="btn text-white" type="button"
                                  id="dropdownSettingsButton" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                            <svg width="1em" height="1em" viewBox="0 0 16 16"
                                 class="bi bi-three-dots-vertical" fill="currentColor"
                                 xmlns="http://www.w3.org/2000/svg">
                              <path fill-rule="evenodd" d="M9.5 13a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zm0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zm0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0z" />
                            </svg>
                          </button>
                          <div class="dropdown-menu dropdown-menu-right" aria-labelledby="dropdownSettingsButton">
                            <button class="dropdown-item" href="#" (click)="openDelete(playLaterMusic.id)">
                              Remove
                            </button>
                          </div>
                        </div>
                      </div>
                    </div>
                </div>
              </div>
              <div class="featured_song_image">
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
