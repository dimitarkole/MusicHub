<div class="player-stage">
  <app-music-image [musicImage]="music.imageUrl" [size]="'large'"></app-music-image>
  <audio controls class="play-song" id="player">
  </audio>
</div>
<br />
<div class="row">
  <div class="col-md-12">
    <span class="music-name">{{music.name}}</span><br />
    <small>Category: {{music.categoryName}}</small>
  </div>
</div>

<div class="row">
  <div class="col-md-7">
    <p>{{music.createdOn | date : 'MMMM d, yyyy'}}</p>
  </div>

  <button class="col-md-2 btn add-to-playlist-bnt main-song-information login100-form-btn" (click)="openAddMusic()" *ngIf="isAuth">
    + Add to
  </button>
  <button class="col-md-2 btn add-to-playlist-bnt main-song-information login100-form-btn" routerLink="/signin" *ngIf="!isAuth">
    + Add to
  </button>
  <app-music-reaction [music]="music" class="col-md-3 main-music-information"></app-music-reaction>
</div>

<div *ngIf="isAdding">
  <ul class="nav nav-tabs" id="myTab" role="tablist">
    <li class="nav-item" role="presentation">
      <button class="nav-link active" id="home-tab" data-bs-toggle="tab" data-bs-target="#playlists" type="button" role="tab" aria-controls="playlists" aria-selected="true">Playlists</button>
    </li>
  </ul>
  <div class="tab-content" id="myTabContent">
    <div class="tab-pane fade show active" id="playlists" role="tabpanel" aria-labelledby="home-tab">
      <app-add-music-to-playlists [musicId]="music.id"></app-add-music-to-playlists>
    </div>
  </div>
</div>
<hr />

<div class="row">
  <div class="col-md-2">
    <app-user-avatar [imageUrl]="music.user?.imageUrl" [type]="'medium'">
    </app-user-avatar>
  </div>

  <div class="col-md-9">
    <div class="row">
      <h3 class="col-md-7">
        <a routerLink="{{'/profile/view/' + music.user?.id}}" class="row ">
          <br />
          {{music.user.userName}}
        </a>
      </h3>
      <app-follow-create class="col-md-5" [userId]="music.user?.id"></app-follow-create>
    </div>
    <br>
    <p>
      {{music.description}}
    </p>
  </div>
</div>
<hr />

<app-comment-list [musicId]="music.id" class="col-md-12"></app-comment-list>
