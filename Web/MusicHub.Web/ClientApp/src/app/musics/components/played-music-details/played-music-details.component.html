<app-music-image [musicImage]="playedMusic.music.imageUrl" [size]="'medium'"></app-music-image>
<div class="text-white music-info container">
  <div class="row">
    <div class="col-md-3">
      <a class="album_play_button" routerLink="/musics/play/{{playedMusic.music.id}}">
      </a>
    </div>
    <div class="col-md-7">
      <div class="row">
        <a class="col-md-12 text-truncate text-white" routerLink="/musics/play/{{playedMusic.music.id}}">
          {{playedMusic.music.name}}
        </a>
        <a routerLink="{{'/profile/view/' + playedMusic.music.user?.id}}"
           class="col-md-12 text-truncate text-white">
          {{playedMusic.music.user.userName}}
        </a>
      </div>
    </div>
  </div>
</div>
