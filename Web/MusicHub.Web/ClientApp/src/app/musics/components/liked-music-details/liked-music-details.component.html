<app-music-image [musicImage]="likedMusic.music.imageUrl" [size]="'medium'"></app-music-image>
<div class="text-white music-info container">
  <div class="row">
    <div class="col-md-3">
      <a class="album_play_button" routerLink="/musics/play/{{likedMusic.music.id}}">
      </a>
    </div>
    <div class="col-md-7">
      <div class="row">
        <a class="col-md-12 text-truncate text-white" routerLink="/musics/play/{{likedMusic.music.id}}">
          {{likedMusic.music.name}}
        </a>
        <a routerLink="{{'/profile/view/' + likedMusic.music.user?.id}}"
           class="col-md-12 text-truncate text-white">
          {{likedMusic.music.user.userName}}
        </a>
      </div>
    </div>
      <div class="col-md-2">
        <div class="dropdown">
          <button class="btn text-white" type="button"
                  id="dropdownSettingsButton" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
            <svg width="1em" height="1em" viewBox="0 0 16 16"
                 class="bi bi-three-dots-vertical" fill="currentColor"
                 xmlns="http://www.w3.org/2000/svg">
              <path fill-rule="evenodd" d="M9.5 13a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zm0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zm0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0z" />
            </svg>
          </button>
          <div class="dropdown-menu dropdown-menu-right" aria-labelledby="dropdownSettingsButton">
            <button class="dropdown-item" href="#" (click)="openDelete(likedMusic.id)">
              Remove
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
