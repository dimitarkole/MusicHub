<h2 class=" row text-center">
  Liked musics
</h2>
<div class="row">
  <div class="col-md-12">
    <div class="featured_list">
      <div id="jp_container_2" class="jp-audio" role="application" aria-label="media player">
        <div class="jp-type-playlist">
          <div class="jp-playlist">
            <div class="d-flex flex-row align-items-start justify-content-start flex-wrap row" style="">
              <div class="jp-playlist-current col-md-3" *ngFor="let likedMusic of likedMusicsPagination.likedMusics index as j">
                <app-liked-music-details [likedMusic]="likedMusic"></app-liked-music-details>

              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
