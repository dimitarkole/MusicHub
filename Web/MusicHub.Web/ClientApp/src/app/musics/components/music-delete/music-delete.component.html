<div id="modal-content-wrapper">
  <header id="modal-header">
    <h3 id="modal-title">Delete music</h3>
    <hr />
  </header>
  <section id="modal-body">
    <p>Do you want to delete this music?</p>
  </section>
  <footer id="modal-footer">
    <div class="row">
      <div class="col-md-8">

      </div>
      <div class="col-md-2">
        <button mat-raised-button id="modal-cancel-button" (click)="closeModal()" [mat-dialog-close]="false">No</button>
      </div>

      <div class="col-md-2">
        <button mat-raised-button id="modal-cancel-button" (click)="deleteMusic()" [mat-dialog-close]="true">Yes</button>
      </div>
    </div>
  </footer>
</div>
